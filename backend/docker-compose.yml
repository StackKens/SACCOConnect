services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: saccoconnect
    ports:
      - "5432:5432"
    volumes:
      - saccoconnect_pg:/var/lib/postgresql/data

volumes:
  saccoconnect_pg:
